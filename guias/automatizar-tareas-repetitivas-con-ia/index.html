  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H37MMGVLKQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-H37MMGVLKQ');
  </script>
  <script>
    (function() {
      function trackInfovendeconiaEvent(eventName, params) {
        if (typeof gtag === 'function') {
          gtag('event', eventName, Object.assign({
            asset_name: 'infovendeconia',
            page_url: window.location.href
          }, params || {}));
        }
      }
      window.addEventListener('click', function(event) {
        var link = event.target && event.target.closest ? event.target.closest('a') : null;
        if (!link) return;
        var href = link.getAttribute('href') || '';
        var text = (link.textContent || '').trim().slice(0, 120);
        var isGuide = href.indexOf('/guias/') !== -1 || link.closest('article, .card, .guide-card');
        var isOutbound = link.hostname && link.hostname !== window.location.hostname;
        var isAffiliate = /amazon|amzn\.to|hostinger|pictory|systeme\.io|picodi/i.test(href);
        if (isAffiliate) {
          trackInfovendeconiaEvent('affiliate_click', { cta_text: text, destination_url: link.href, cta_location: 'link', merchant: link.hostname });
        } else if (isOutbound) {
          trackInfovendeconiaEvent('outbound_click', { cta_text: text, destination_url: link.href, cta_location: 'link' });
        } else if (isGuide) {
          trackInfovendeconiaEvent('guide_click', { cta_text: text, destination_url: link.href, cta_location: 'guide_link' });
        } else if (href && href !== '#') {
          trackInfovendeconiaEvent('cta_click', { cta_text: text, destination_url: link.href, cta_location: 'link' });
        }
      }, true);
    })();
  </script>
